<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Reddit Checker System</title>
    <style>
        body { background: #0b0f17; color: #00eaff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { border: 1px solid #00eaff; padding: 20px; display: inline-block; border-radius: 10px; background: #161b22; }
        input { padding: 10px; border-radius: 5px; border: none; width: 250px; }
        button { padding: 10px 20px; background: #00eaff; color: #000; border: none; cursor: pointer; font-weight: bold; }
        .error { color: #ff4b4b; margin-top: 10px; }
        .success { color: #00ff88; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Reddit Account Checker</h2>
        <input type="text" id="username" placeholder="Enter Reddit Username (u/...)">
        <button id="btn" onclick="startCheck()">Verify Access</button>
        <div id="msg"></div>
    </div>

    <script>
        // --- إعداداتك ---
        const RENDER_URL = "https://karma-588r.onrender.com";// استبدله برابط Render الخاص بك
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzfoA723DRJg_wgPmS42Vyx_UlizFLJUnNr8ZXDdWXyhVrZJHPh0vQy5IrOHIiSerrG/exec"; // رابط Google Script
        const MIN_KARMA = 200;
        const MIN_AGE_DAYS = 240;

        async function startCheck() {
            const user = document.getElementById('username').value.trim();
            const msg = document.getElementById('msg');
            if(!user) return;

            msg.innerHTML = "Checking database...";
            msg.className = "";

            try {
                const response = await fetch(`${RENDER_URL}/check/${user}`);
                const data = await response.json();

                if (data.valid) {
                    const ageDays = Math.floor((Date.now() / 1000 - data.created_utc) / 86400);
                    
                    if (data.total_karma >= MIN_KARMA && ageDays >= MIN_AGE_DAYS) {
                        msg.innerHTML = "✅ Verification Successful! Redirecting...";
                        msg.className = "success";
                        setTimeout(() => window.location.href = GOOGLE_SHEET_URL, 2000);
                    } else {
                        msg.innerHTML = `❌ Low Karma (${data.total_karma}) or Age (${ageDays} days)`;
                        msg.className = "error";
                    }
                } else {
                    msg.innerHTML = "❌ " + (data.error || "User not found");
                    msg.className = "error";
                }
            } catch (err) {
                msg.innerHTML = "❌ Connection to Render failed";
                msg.className = "error";
            }
        }
    </script>
</body>
</html>
